# Central configuration for the EHR comorbidity-trajectory project.
# Every tunable parameter lives here; code must not hard-code values.
# Relative paths are resolved against the project root, not the working directory.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: artifacts
  reports_dir: reports
  figures_dir: reports/figures
  patients_csv: data/raw/patients.csv
  conditions_csv: data/raw/conditions.csv
  encounters_csv: data/raw/encounters.csv
  events_parquet: data/processed/events.parquet
  events_clinical_parquet: data/processed/events_clinical.parquet
  code_dictionary_csv: data/processed/code_dictionary.csv
  data_summary_md: reports/data_summary.md
  clinical_summary_md: reports/clinical_summary.md
  events_per_patient_fig: reports/figures/events_per_patient_hist.png
  top_conditions_fig: reports/figures/top_conditions_bar.png
  # Patients alive and with an active clinical condition, and clinical events dated, per
  # year (data.plot_active_patients, written with clinical_summary_md).
  active_patients_fig: reports/figures/active_patients_per_year.png
  # Phase 2 outputs (trajectories.save_trajectories).
  trajectories_parquet: data/processed/trajectories.parquet
  patient_index_json: data/processed/patient_index.json
  code_vocabulary_json: data/processed/code_vocabulary.json
  windows_npz: data/processed/windows.npz
  windows_json: data/processed/windows.json
  # Full-range transitions, for analysis only: features must use only those that end
  # before labels.cutoff_date (trajectories.pre_cutoff_transitions).
  transitions_npz: data/processed/transitions.npz
  transitions_parquet: data/processed/transitions.parquet
  trajectories_summary_md: reports/trajectories_summary.md
  # Phase 3 outputs (features.save_features). features_dir holds features_<year>.npz
  # per window and features.json.
  features_dir: data/processed/features
  comorbidity_counts_npz: data/processed/comorbidity_counts.npz
  comorbidity_lift_npz: data/processed/comorbidity_lift.npz
  chronic_comorbidity_counts_npz: data/processed/chronic_comorbidity_counts.npz
  chronic_comorbidity_lift_npz: data/processed/chronic_comorbidity_lift.npz
  # Patients with a non-zero feature row in some training-period window; Phase 4 on.
  model_cohort_json: data/processed/model_cohort.json
  tfidf_idf_npy: artifacts/tfidf_idf.npy
  transition_svd_npz: artifacts/transition_svd.npz
  features_summary_md: reports/features_summary.md
  comorbidity_heatmap_fig: reports/figures/comorbidity_lift_heatmap.png
  # Phase 4 outputs (graph.save_graphs). graphs_dir holds W_<year>.npz and
  # A_hat_<year>.npz per training-period window, graphs.json, and the final window's
  # spectral embedding and phenotype clusters.
  graphs_dir: data/processed/graphs
  graphs_summary_md: reports/graphs_summary.md
  eigenvalues_fig: reports/figures/eigenvalues_final_window.png
  graph_drift_fig: reports/figures/graph_drift.png
  # Phase 5 outputs (labels.save_labels).
  labels_parquet: data/processed/labels.parquet
  splits_json: data/processed/splits.json
  labels_summary_md: reports/labels_summary.md
  # Phase 6 outputs (train.save_training). Embedding rows follow model_cohort.json.
  model_pt: artifacts/model.pt
  config_used_yaml: artifacts/config_used.yaml
  train_log_csv: artifacts/train_log.csv
  train_metrics_json: artifacts/train_metrics.json
  embeddings_per_window_npy: artifacts/embeddings_per_window.npy
  trajectory_embeddings_npy: artifacts/trajectory_embeddings.npy
  training_curves_fig: reports/figures/training_curves.png
  training_summary_md: reports/training_summary.md
  # Calibration of the any_onset logits (calibration.method), fitted on validation by
  # 06_train.py: the method and its slope and intercept.
  calibration_json: artifacts/calibration.json
  reliability_fig: reports/figures/reliability_any_onset.png
  # scripts/06_train.py --quick writes every Phase 6 output here instead, under the
  # same file names, so a smoke test never overwrites the real model.
  quick_dir: artifacts/quick
  # Phase 6b: validation-only baselines (06a_baselines.py) and tuning (06b_tune.py).
  baseline_results_csv: reports/baseline_results.csv
  baselines_summary_md: reports/baselines_summary.md
  # Validation patients' any_onset label and each baseline's score, so 06_train.py can
  # compare the final model with the baselines on the same bootstrap resamples.
  baseline_val_scores_csv: artifacts/baseline_val_scores.csv
  tuning_results_csv: reports/tuning_results.csv
  tuning_summary_md: reports/tuning_summary.md
  # Phase 7 (scripts/07_evaluate.py): the cross-validation table (results.csv), every
  # result (results.md) and the plain-language findings.
  results_md: reports/results.md
  results_csv: reports/results.csv
  evaluation_summary_md: reports/evaluation_summary.md
  # Out-of-fold predictions of every model (07_evaluate.py --reuse-cv reads them back),
  # one row per fit (fold, model, seed), and the final model's predictions.
  cv_predictions_csv: artifacts/cv_oof_predictions.csv
  cv_fits_csv: artifacts/cv_fits.csv
  test_predictions_csv: artifacts/test_predictions.csv
  cv_auroc_fig: reports/figures/cv_auroc.png
  test_reliability_fig: reports/figures/reliability_test.png
  umap_phenotype_fig: reports/figures/umap_phenotype.png
  umap_age_fig: reports/figures/umap_age_group.png
  umap_chronic_fig: reports/figures/umap_chronic_conditions.png
  trajectory_umap_fig: reports/figures/trajectories_umap.png
  # Phase 7b (scripts/07b_embeddings.py): the self-supervised TemporalGraphAE. graph_ae_dir
  # holds each variant's state_dict (<key>.pt) and training log (<key>_log.csv), the
  # tuning runs and the config used; embeddings_npz every compared embedding.
  graph_ae_dir: artifacts/graph_ae
  embeddings_npz: artifacts/embeddings_7b.npz
  embedding_results_md: reports/embedding_results.md
  embedding_results_csv: reports/embedding_results.csv
  embedding_summary_md: reports/embedding_summary.md
  ae_umap_phenotype_fig: reports/figures/ae_umap_phenotype.png
  ae_umap_age_fig: reports/figures/ae_umap_age_group.png
  ae_umap_chronic_fig: reports/figures/ae_umap_chronic_conditions.png
  ae_trajectory_fig: reports/figures/ae_trajectories_umap.png
  next_year_auroc_fig: reports/figures/next_year_auroc.png
  # Phase 8 (scripts/08_predict_demo.py): the example patients' predictions.
  predict_demo_md: reports/predict_demo.md
  # The hand-written findings of Phases 4-7b (shown on the app's overview page).
  findings_md: reports/findings.md
  # Phase 9 app assets (scripts/09_app_assets.py), read by app/streamlit_app.py: the UMAP of
  # every reference GraphAE state, the chronic comorbidity network (pairs, clusters, layout),
  # the graph drift between consecutive windows and the dataset statistics.
  app_dir: artifacts/app
  app_state_umap_npz: artifacts/app/state_umap.npz
  app_network_nodes_csv: artifacts/app/comorbidity_nodes.csv
  app_network_pairs_csv: artifacts/app/comorbidity_pairs.csv
  app_drift_csv: artifacts/app/graph_drift.csv
  app_stats_json: artifacts/app/app_stats.json
  # Phase 10: scripts/run_all.py's timing per step, and the report figures that
  # scripts/10_final_figures.py copies (numbered, in final_figures order) with their captions.
  run_all_timing_md: reports/run_all_timing.md
  final_figures_dir: reports/figures/final
  final_captions_md: reports/figures/final/captions.md

# Global random seed used by random, numpy and torch.
seed: 42

data:
  min_conditions_per_patient: 2
  # Codes that record one concept under two codes (data.merge_codes), as
  # {old_code: canonical_code}. Applied before code_filter, so a merged code is
  # judged on the descriptions of both. Canonical codes must not be merged again.
  code_merge:
    # Prediabetes (older Synthea) -> Prediabetes (finding). The current single-version
    # data has no 15777000; merge_codes only warns, so the rule is kept for older exports.
    "15777000": "714628002"
  # Which condition codes are clinical (data.filter_clinical_events). A code is kept
  # if ANY of its descriptions ends with a keep_suffix or equals a keep_description,
  # both compared case-insensitively; every other code (social, administrative,
  # symptoms, most history-of, ...) is dropped. Any wording counts because Synthea
  # versions differ: "Stroke" and "Cerebrovascular accident (disorder)" share a code.
  code_filter:
    keep_suffixes: ["(disorder)"]
    keep_descriptions:
      # Metabolic findings
      - Prediabetes (finding)
      - Body mass index 30+ - obesity (finding)
      - Body mass index 40+ - severely obese (finding)
      # Chronic pain and mental health
      - Chronic pain (finding)
      - Chronic low back pain (finding)
      - Chronic neck pain (finding)
      - Severe anxiety (panic) (finding)
      # Injuries tagged other than "(disorder)"
      - Sprain (morphologic abnormality)
      - Burn injury (morphologic abnormality)
      # Disorders this Synthea version records without the "(disorder)" tag
      - Gout
      - Nonproliferative diabetic retinopathy due to type II diabetes mellitus  # 1551000119108
      - Proliferative diabetic retinopathy due to type II diabetes mellitus  # 1501000119109
      # Substance use. Alcoholism and Dependent drug abuse are already kept by
      # "(disorder)"; Opioid abuse (5602001) is untagged in this data, so it is listed.
      - Smokes tobacco daily (finding)
      - Unhealthy alcohol drinking behavior (finding)
      - Misuses drugs (finding)
      - Opioid abuse
      # History of major cardiac events (no cerebrovascular history codes in the data)
      - History of myocardial infarction (situation)
      - History of coronary artery bypass grafting (situation)
      - History of aortic valve replacement (situation)
      # Removed (15): wordings from older Synthea versions that match no code in this
      # export, so they kept nothing: Prediabetes, Hypertension, Hyperlipidemia,
      # Bacteremia (finding), Coronary Heart Disease, Cardiac Arrest, Drug overdose,
      # Escherichia coli urinary tract infection, Cystitis, Brain damage - traumatic,
      # Chronic paralysis due to lesion of spinal cord, Cystic Fibrosis, Infection
      # caused by Pseudomonas aeruginosa, Male Infertility, History of cardiac arrest
      # (situation). Re-add them for an older export; without "Prediabetes", merged
      # 15777000 events are kept only if 714628002 also has its "(finding)" wording.

trajectories:
  window: yearly
  # The data has a complete record only from late 2016, consistent with Synthea's
  # default 10-year export history before the run date (2026-10-30). Before that,
  # mostly conditions still open at the horizon survive: encounters jump from
  # ~2,000/year (2008-2013) to ~11,000/year from 2017, and 71% of clinical events
  # dated before 2016-10-30 have no STOP against 14% after. Earlier windows would
  # miss most acute conditions, so the series starts at the first full year, 2017.
  # Conditions that began earlier and are still active are carried into 2017 by
  # their active span, and the event-level trajectories and transitions keep every
  # event. Events run to 2026-10-30, so 2025 is the last full window.
  start_year: 2017
  end_year: 2025

features:
  # General codes dropped from the feature vocabulary (code block, transitions and the
  # chronic comorbidity table): at >= redundant_min_share of their encounters Synthea
  # also records a more specific code (features.co_recorded_codes). Found on the cohort's
  # encounters; the all-pairs comorbidity table keeps them.
  redundant_codes:
    - "312608009"  # Laceration - injury: hand, foot, forearm, thigh, facial laceration
    - "384709000"  # Sprain (morphologic abnormality): sprain of ankle, sprain of wrist
    - "125605004"  # Fracture of bone: forearm, clavicle, ankle, wrist, rib, hip, osteoporotic
    - "48333001"  # Burn injury (morphologic abnormality): epidermal, partial, full thickness
    - "90460009"  # Injury of neck: whiplash injury to neck (1:1, 119 encounters each)
    - "125601008"  # Injury of knee: meniscus tear, ACL, MCL, patellar tendon rupture
    - "110030002"  # Concussion injury of brain: with / without loss of consciousness (95.7%)
    - "126906006"  # Neoplasm of prostate: carcinoma in situ, metastatic neoplasm of prostate
    - "19169002"  # Miscarriage in first trimester: complete miscarriage, blighted ovum, tubal
    - "262574004"  # Bullet wound: gunshot wound (1:1, 6 encounters); gunshot wound is kept
  # Meet the rule but kept, as they are not general codes of what they are recorded with:
  # Cerebral palsy (128188000; recorded with its complications), Miscarriage in second
  # trimester (85116003; recorded with its causes), and distinct conditions recorded
  # together 1:1 in <= 8 patients: gallbladder calculus + acute cholecystitis, injury of
  # kidney + acquired coagulation disorder, and one-patient spina bifida and spinal cord
  # injury bundles. The report lists them all.
  redundant_min_share: 0.95
  # Row norm applied to each window's TF-IDF matrix (sklearn.preprocessing.normalize).
  tfidf_norm: l2
  # X_cum_t = sum over s <= t of exp(-lambda * (t - s)) * X_s, with t - s in years.
  time_decay_lambda: 0.1
  # Per-patient transition vectors, cumulative per window: window t uses transitions that
  # end by the end of year t and before labels.cutoff_date. TruncatedSVD is fit once on
  # the last training-period window's block and applied to every window.
  transition_svd_components: 32
  transition_svd_n_iter: 5
  # Each block is row-L2-normalized before concatenation; the transition block is then
  # scaled by this weight, so with both blocks present it holds w^2 / (1 + w^2) of
  # each final row's squared norm (0.5 at 1.0).
  transition_weight: 1.0
  # A condition episode is chronic if it has no STOP date or lasts longer than this.
  chronic_min_duration_days: 365

graph:
  # k-NN patient-similarity graph per training-period window (graph.knn_graph); edge
  # weight is cosine similarity, symmetrized with max(W, W^T). Only cosine is supported.
  k: 10
  metric: cosine
  # Working memory (MB) sklearn may use per block of the k-NN search: cosine distances
  # are computed a block of rows at a time, never as a dense N x N matrix.
  knn_working_memory_mb: 8
  # Spectral embedding of the final training window (its largest connected component):
  # the spectral_dim smallest non-trivial eigenvectors of the normalized Laplacian.
  spectral_dim: 16
  # Eigengap analysis on the final window: the first eigengap_n_eigenvalues eigenvalues;
  # the suggested number of clusters is the k >= eigengap_min_clusters before the
  # largest gap.
  eigengap_n_eigenvalues: 20
  eigengap_min_clusters: 2
  # Phenotypes: k-means on the first k eigenvectors (rows L2-normalized); each cluster's
  # top chronic conditions by prevalence ratio (cluster / all clustered patients), among
  # conditions present in at least phenotype_min_patients of the cluster's patients.
  kmeans_n_init: 10
  phenotype_top_conditions: 5
  phenotype_min_patients: 10
  # Graph drift: a consecutive-window pair whose mean neighbourhood Jaccard is below its
  # adjacent pairs and more than this below the straight line through them (a dip, not a
  # steady trend) is a jump; see graph.drift_jumps.
  drift_jump_threshold: 0.1

labels:
  # Prediction cutoff: features use only events strictly before this date.
  # Trajectories may run past it; only windows that close on or before the cutoff
  # are used as features, and later windows are used for labels only.
  # 2023-01-01 gives feature windows 2017-2022 and label windows 2023-2025.
  cutoff_date: 2023-01-01
  # Labels use events from the cutoff to cutoff + horizon_years, exclusive: 2023-01-01
  # to 2025-12-31. Nothing on or after the horizon end (2026) is read for labels.
  horizon_years: 3
  # Loss to follow-up: a patient alive through the horizon whose last encounter (of any
  # type, before the horizon end) is before this date has every onset label masked.
  min_last_encounter_date: 2025-01-01
  # Review threshold on new onsets in the horizon: type2_diabetes (44054006) was dropped
  # for falling below it (22 onsets). The report flags any kept group below it.
  min_onsets: 30
  # Kept groups just above min_onsets; flagged as borderline in the report.
  borderline_groups: [ckd, metabolic_syndrome]
  # Kept groups not flagged borderline but also close to min_onsets; the report notes them.
  near_threshold_groups: [chronic_pain]
  # Onset labels (labels.build_labels): a group's onset is the first event of any of its
  # codes. Masked if it was before the cutoff; 1 if it is in the horizon; else 0. These
  # are the secondary targets; the primary target any_onset pools them (labels.ANY_ONSET).
  # Approved at review. Not added: History of coronary artery bypass grafting to
  # ischemic_heart_disease.
  onset_groups:
    ckd:  # any stage, or disorder of kidney due to diabetes
      - "431855005"  # Chronic kidney disease stage 1
      - "431856006"  # Chronic kidney disease stage 2
      - "433144002"  # Chronic kidney disease stage 3
      - "431857002"  # Chronic kidney disease stage 4
      - "46177005"  # End-stage renal disease
      - "127013003"  # Disorder of kidney due to diabetes mellitus
    prediabetes:
      - "714628002"  # Prediabetes (finding)
    hypertension:
      - "59621000"  # Essential hypertension
    ischemic_heart_disease:  # including MI, STEMI and NSTEMI
      - "414545008"  # Ischemic heart disease
      - "4557003"  # Preinfarction syndrome
      - "22298006"  # Myocardial infarction
      - "401303003"  # Acute ST segment elevation myocardial infarction
      - "401314000"  # Acute non-ST segment elevation myocardial infarction
      - "399211009"  # History of myocardial infarction (situation)
    metabolic_syndrome:
      - "237602007"  # Metabolic syndrome X
    hyperlipidemia:  # or hypertriglyceridemia
      - "55822004"  # Hyperlipidemia
      - "302870006"  # Hypertriglyceridemia
    obesity:  # BMI 30+
      - "162864005"  # Body mass index 30+ - obesity (finding)
      - "408512008"  # Body mass index 40+ - severely obese (finding)
    chronic_pain:  # including fibromyalgia and chronic migraine
      - "82423001"  # Chronic pain (finding)
      - "278860009"  # Chronic low back pain (finding)
      - "1121000119107"  # Chronic neck pain (finding)
      - "203082005"  # Fibromyalgia
      - "95417003"  # Primary fibromyalgia syndrome
      - "124171000119105"  # Chronic intractable migraine without aura
      # Chronic migraine under its older name. The data has no chronic migraine "with
      # aura" code.
      - "427419006"  # Transformed migraine
    substance_use:  # drug abuse, opioid, alcohol, overdose
      - "6525002"  # Dependent drug abuse
      - "5602001"  # Opioid abuse
      - "361055000"  # Misuses drugs (finding)
      - "7200002"  # Alcoholism
      - "10939881000119105"  # Unhealthy alcohol drinking behavior (finding)
      - "1149222004"  # Overdose (the only overdose code in the data)

# Temporal GCN (models.OnsetModel) and its full-batch training (train.fit).
model:
  # hidden_dim, embed_dim, dropout, weight_decay, smoothness_weight and drop_edge are the
  # setting chosen by scripts/06b_tune.py (setting 25 of reports/tuning_summary.md: best
  # mean validation AUROC of any_onset over seeds 42-44, 0.6769 +/- 0.0074). The Phase 6
  # values are kept in baselines.reference_model.
  # GCN widths: features -> hidden_dim -> embed_dim per window, weights shared across
  # windows. The GRU over the windows also has embed_dim units, so the per-window and
  # trajectory embeddings share a width.
  hidden_dim: 64
  embed_dim: 32
  # Dropout between the two GCN layers.
  dropout: 0.6
  lr: 0.01
  # Written as 5.0e-3 (not 5e-3): PyYAML reads 5e-3 as a string.
  weight_decay: 5.0e-3
  epochs: 200
  # Early stopping: stop after this many epochs without a higher validation AUROC of
  # any_onset; the weights of the best epoch are kept.
  patience: 20
  # Max L2 norm of all gradients together (torch.nn.utils.clip_grad_norm_).
  grad_clip_norm: 1.0
  # Loss = BCE(any_onset) + secondary_weight * masked BCE(onset groups).
  secondary_weight: 0.5
  # Weight of the auxiliary graph-smoothness loss, the mean over windows of
  # trace(Z^T L Z) / trace(Z^T Z) (models.graph_smoothness). 0 turns it off.
  smoothness_weight: 0.0
  # DropEdge: each training epoch, drop this fraction of every window's (undirected)
  # edges at random and renormalize A_hat (models.EdgeDropper). Evaluation always
  # uses the full graphs. 0 turns it off.
  drop_edge: 0.0
  # Concatenate age at labels.cutoff_date (standardized with training-split statistics)
  # and sex (1 = male, 0 = female) to the trajectory embedding before the heads. They
  # never enter the graphs or the node features.
  use_demographics: true
  # Log a progress line every this many epochs (and at each new best).
  log_every_epochs: 10
  # scripts/06_train.py --quick: this many epochs on this many patients (drawn with the
  # global seed; the graph is the induced subgraph, renormalized).
  quick_epochs: 5
  quick_patients: 300

# Validation-only baselines for any_onset (evaluate.run_baselines, scripts/06a_baselines.py):
# logistic regression on the 2022 window, or on every training window concatenated,
# each without and with age and sex; same split and masked labels as the GCN.
baselines:
  # sklearn LogisticRegression: L2 penalty with this inverse strength, lbfgs.
  C: 1.0
  max_iter: 5000
  # Weight classes inversely to their training frequency, like the GCN's pos_weight.
  balanced_class_weight: true
  # The Phase 6 TemporalGCN setting, retrained (seed 42) as the reference row, with
  # and without demographics. Its validation AUROC was 0.679.
  reference_model:
    hidden_dim: 64
    embed_dim: 32
    dropout: 0.5
    weight_decay: 5.0e-4
    smoothness_weight: 0.0
    drop_edge: 0.0
    use_demographics: false

# Hyperparameter search on validation only (train.tuning_settings, scripts/06b_tune.py).
# Every combination of the lists below, each trained once per seed, with model.lr and
# model.patience (early stopping on validation AUROC of any_onset) and every other
# model value from the model section. Ranked by mean validation AUROC of any_onset.
tuning:
  seeds: [42, 43, 44]
  weight_decay: [5.0e-4, 5.0e-3, 1.0e-2]
  dropout: [0.5, 0.6]
  # (hidden_dim, embed_dim) pairs.
  dims: [[64, 32], [32, 16]]
  smoothness_weight: [0.0, 0.1]
  drop_edge: [0.0, 0.2]
  # Run at most this many settings: a random subset (drawn with the global seed) when
  # the grid is larger.
  max_settings: 48
  # Settings whose mean AUROC is within this of the best count as tied; the simplest
  # of them wins (train.select_setting): fewest of smoothness and DropEdge switched on,
  # then the smaller model, then the higher mean AUROC.
  tie_tolerance: 0.005
  # Settings listed in reports/tuning_summary.md.
  top_n_report: 5

# Metrics (evaluate): bootstrap CIs and calibration, on validation (Phase 6) and on the
# test set and out-of-fold predictions (Phase 7).
evaluation:
  # Percentile bootstrap over the scored patients, drawn with the global seed.
  bootstrap_resamples: 1000
  ci_level: 0.95
  # Reliability diagram and expected calibration error: equal-count bins.
  calibration_bins: 10
  # Out-of-sample check of the calibration: refit on k - 1 stratified folds of the
  # validation patients and score the held-out fold.
  calibration_cv_folds: 5
  # Search range of the temperature (calibration.method: temperature). Logits that barely
  # rank (e.g. a small fold) can push the fit to T -> infinity (every probability 0.5); a
  # fit at a bound is logged.
  temperature_bounds: [0.01, 100.0]

# Calibration of the any_onset logits, fitted on validation predictions (06_train.py) and
# on each cross-validation fold's inner validation set (07_evaluate.py).
calibration:
  # platt: logistic regression of the label on the logit, with an intercept, by maximum
  # likelihood: probability = sigmoid(slope * logit + intercept). The intercept can undo
  # the upward shift that training with pos_weight gives the logits.
  # temperature: probability = sigmoid(logit / T); rescales logits around 0 only.
  method: platt

# Phase 7 cross-validation (evaluate.run_cross_validation, scripts/07_evaluate.py): every
# patient with an observed any_onset label, in folds stratified by Phase 4 phenotype cluster
# x any_onset, drawn with the global seed. Every model value stays as in the model section.
cross_validation:
  folds: 5
  # Share of each fold's training patients (stratified the same way) held out for early
  # stopping and calibration; every model is fitted on the rest.
  inner_val: 0.15
  # Every GCN model is trained once per seed in each fold; the seeds' logits are averaged.
  seeds: [42, 43, 44]
  # Negative control (model 7): each window's graph rewired by degree-preserving double
  # edge swaps, this many attempted swaps per edge, drawn with the global seed.
  rewire_swaps_per_edge: 10
  # Reporting only: a model whose out-of-fold logits rank patients like age and sex alone
  # (mean within-fold Spearman correlation with model 1 at least this) is reported as
  # having learned little beyond the demographics in its heads.
  demographic_rank_correlation: 0.9

# Phase 7 embedding analysis of the final model (evaluate.analyse_embeddings).
embedding_analysis:
  # UMAP (umap-learn), seeded with the global seed.
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  # Bins of the number of chronic conditions active in 2017-2022, left-closed; .inf
  # leaves the last open.
  chronic_count_bins: [0, 1, 2, 4, 7, .inf]
  # Trajectory figure: patients drawn with the global seed (a different phenotype each
  # while possible) among those with a non-empty feature row in every window and at least
  # trajectory_min_onsets chronic-condition onsets in those windows.
  trajectory_patients: 5
  trajectory_min_onsets: 2
  # Onsets written beside each point of the figure (the rest counted as "+n"), each cut
  # to this many characters.
  max_onset_labels: 2
  onset_label_chars: 30
  # Nearest-neighbour check: patients drawn the same way among those with at least
  # neighbour_min_conditions chronic conditions, and neighbours listed per patient.
  neighbour_patients: 3
  n_neighbours: 5
  neighbour_min_conditions: 3

# Phase 7b: self-supervised temporal graph autoencoder (models.TemporalGraphAE, trained by
# train.fit_graph_ae). The encoder is the TemporalGCN's (shared 2-layer GCN per window, GRU
# over the windows), with no demographics and no onset labels. Loss = link reconstruction
# (inner-product decoder on each window's k-NN edges vs as many sampled non-edges, BCE) +
# next_window_weight * next-window BCE (a linear decoder from the GRU state at window t to
# the active codes of window t + 1, pairs 2017->2018 ... 2021->2022 only, pos_weight per
# code from the training split). Only training-split patients' next-window terms enter the
# loss; validation-split patients' pick the epoch; test-split patients pass messages and
# enter the link term but never a next-window term.
graph_ae:
  # The Phase 6 TemporalGCN setting (baselines.reference_model): not searched.
  hidden_dim: 64
  embed_dim: 32
  dropout: 0.5
  lr: 0.01
  weight_decay: 5.0e-4
  epochs: 300
  # Early stopping: stop after this many epochs without a lower validation next-window
  # loss; the weights of the best epoch are kept.
  patience: 20
  grad_clip_norm: 1.0
  # Weight of the next-window term: 2, chosen by the validation next-window-loss search
  # below (lowest mean over tuning_seeds; artifacts/graph_ae/tuning_runs.csv). Every
  # reported GraphAE number uses 2. scripts/07b_embeddings.py reruns the search and trains
  # its final models with the weight it picks.
  next_window_weight: 2.0
  # Log progress, and the share of variance on the first principal component of the
  # final GRU states (the anti-collapse check), every this many epochs.
  log_every_epochs: 10
  # Only next_window_weight is tuned (embed_dim stays 32), each value trained once per
  # seed and chosen by the lowest mean validation next-window loss (unweighted BCE, so
  # comparable across weights).
  tuning_next_window_weights: [0.5, 1.0, 2.0]
  tuning_seeds: [42, 43, 44]

# Phase 7b embedding comparison (ehrgraph.embeddings, scripts/07b_embeddings.py).
embedding_eval:
  # Width of every compared embedding: PCA components, Laplacian eigenvectors.
  dim: 32
  # Next-year new-condition prediction 2021 -> 2022: one logistic regression per code on
  # the 2021 embedding, for codes with at least this many new onsets (first-ever event in
  # 2022) among training-split patients at risk; fitted on training-split patients and
  # scored on test-split patients. Unweighted classes, so the probabilities of different
  # codes are on one scale for the pooled (micro) AUROC.
  min_train_onsets: 20
  C: 1.0
  max_iter: 5000
  balanced_class_weight: false
  # Neighbour concordance: mean Jaccard of chronic conditions with this many nearest
  # neighbours (cosine), for test-split patients with a chronic condition.
  n_neighbours: 5

# Phase 8 inference (inference.Predictor, scripts/08_predict_demo.py). A new patient is placed
# among the model-cohort (reference) patients with the saved transforms, graphs and weights;
# nothing is refitted or retrained. Graph insertion uses graph.k neighbours; the similarity
# search uses the 2022 spectral embedding of Phase 7b (embedding_eval.dim eigenvectors).
inference:
  # The GraphAE whose per-window GRU states give the new patient's trajectory: the final
  # TemporalGraphAE of Phase 7b (<paths.graph_ae_dir>/<graph_ae_key>.pt).
  graph_ae_key: graph_ae
  # A condition given with its onset only (no stop) counts as chronic, active from its onset
  # through the last window, when at least this share of its reference episodes are chronic
  # (features.chronic_mask); otherwise as acute, active in its onset year only. The shares
  # are nearly all 0 or 1 (5 of the 214 codes lie between 0.2 and 0.8).
  chronic_default_share: 0.5
  # Similar reference patients listed, by cosine similarity in the spectral embedding.
  n_similar: 10
  # Neighbour outcomes: among this many nearest reference patients, the share with each
  # onset in the label horizon, over those whose label is observed.
  outcome_neighbours: [10, 50]
  # Optional age filter of the similar patients (Predictor.similar_patients(age_band=...)):
  # keep reference patients within +/- this many years of the patient's age at
  # labels.cutoff_date, taking further candidates from the spectral ranking so that
  # n_similar remain. A post-filter: the graphs and the embeddings never change. The app's
  # age-band toggle uses this band.
  age_band_years: 10
  # explain(): lift of the patient's chronic conditions among this many nearest reference
  # patients over all reference patients; the explain_top highest are listed.
  explain_neighbours: 50
  explain_top: 5
  # predict_demo.md: where the elderly multimorbid reference patients fall, those at least
  # elderly_min_age years old at the cutoff with at least elderly_min_chronic chronic
  # conditions in 2017-2022.
  elderly_min_age: 75
  elderly_min_chronic: 6
  # Example patients of scripts/08_predict_demo.py; history entries are [onset year, code].
  # They are realistic profiles, not chosen to land in different phenotypes: the
  # multimorbid elderly patient falls in phenotype 2 with the metabolic-syndrome pattern, as
  # do most elderly multimorbid reference patients (cardio-metabolic continuum).
  demo_patients:
    - name: Healthy young adult
      birth_date: 1999-03-15
      sex: F
      history:
        - [2018, "444814009"]  # Viral sinusitis
        - [2020, "195662009"]  # Acute viral pharyngitis
        - [2021, "66383009"]  # Gingivitis
        - [2022, "44465007"]  # Sprain of ankle
        - [2022, "384709000"]  # Sprain (morphologic abnormality): redundant, dropped as in Phase 3
        - [2022, "12345678"]  # not in the code vocabulary: reported as unknown
    - name: Metabolic-syndrome pattern
      birth_date: 1972-06-01
      sex: M
      history:
        - [2017, "162864005"]  # Body mass index 30+ - obesity
        - [2018, "714628002"]  # Prediabetes
        - [2019, "444814009"]  # Viral sinusitis
        - [2019, "59621000"]  # Essential hypertension
        - [2021, "237602007"]  # Metabolic syndrome X
    - name: Multimorbid elderly
      birth_date: 1944-09-10
      sex: F
      history:
        - [2010, "59621000"]  # Essential hypertension
        - [2012, "55822004"]  # Hyperlipidemia
        - [2014, "44054006"]  # Diabetes mellitus type 2
        - [2016, "414545008"]  # Ischemic heart disease
        - [2017, "239873007"]  # Osteoarthritis of knee
        - [2018, "431856006"]  # Chronic kidney disease stage 2
        - [2019, "271737000"]  # Anemia
        - [2020, "64859006"]  # Osteoporosis
        - [2021, "88805009"]  # Chronic congestive heart failure
    # Pain- and musculoskeletal-dominated elderly history.
    - name: Chronic pain and musculoskeletal
      birth_date: 1944-09-10
      sex: F
      history:
        - [2013, "162864005"]  # Body mass index 30+ - obesity
        - [2015, "82423001"]  # Chronic pain
        - [2015, "278860009"]  # Chronic low back pain
        - [2016, "239873007"]  # Osteoarthritis of knee
        - [2017, "414545008"]  # Ischemic heart disease
        - [2018, "64859006"]  # Osteoporosis
        - [2019, "271737000"]  # Anemia
        - [2020, "55822004"]  # Hyperlipidemia

# Phase 9 Streamlit app (app/streamlit_app.py) and its assets (scripts/09_app_assets.py).
# The app trains nothing: it loads inference.Predictor once and the saved assets.
app:
  # The reference map: one UMAP (embedding_analysis settings) of every non-empty
  # patient-window's TemporalGraphAE state, as in Phase 7b. A new patient's state after each
  # window is drawn at the mean map position of its this-many nearest reference states
  # (Euclidean, in the 32-d state space); the UMAP itself is never refitted.
  map_neighbours: 10
  # Similarity graph over time: this many reference patients, drawn once with the global
  # seed, shown in every year at their 2022 position on the reference map.
  graph_sample_patients: 400
  # Comorbidity network: chronic codes in at least summary.chronic_min_patients patients,
  # pairs from the Phase 3 chronic comorbidity counts, codes on a circle in the dendrogram's
  # leaf order. Codes are coloured by the Phase 3 heatmap clustering (average linkage of the
  # clipped log2 lift profiles, here of these 44 codes), cut into network_clusters branches.
  # Average linkage chains peripheral codes off one at a time, so the cut keeps four
  # multi-code clusters (cardio-metabolic and renal 21, pain/migraine/drug use 8, anxiety/
  # alcohol/neck pain 3, sleep 2) at 14 branches; branches with fewer than
  # network_min_cluster_size codes are shown as unclustered.
  network_clusters: 14
  network_min_cluster_size: 2
  # The network page's default filters: minimum lift and minimum patients with the pair.
  network_min_lift: 2.0
  network_min_patients: 30
  # Condition timeline: episodes shorter than this are drawn this long, so they stay visible.
  timeline_min_days: 30

# Patient-level split of the model cohort (labels.stratified_split), stratified by
# Phase 4 phenotype cluster x any_onset label (masked is its own value), drawn with the
# global seed.
split:
  train: 0.7
  val: 0.15
  test: 0.15

# reports/data_summary.md, reports/clinical_summary.md, reports/trajectories_summary.md
# and their figures.
summary:
  top_n_conditions: 20
  # Age-group edges in completed years, left-closed; .inf leaves the last group open.
  age_bins: [0, 18, 30, 45, 65, 80, .inf]
  events_hist_bins: 40
  # Figure layout: sizes given in pixels (line widths, bar thickness, cell gaps) are
  # pixels at figure_dpi. PNGs are written at figure_save_dpi, so a figure saved at 300
  # looks the same as at 150, with twice the resolution.
  figure_dpi: 150
  figure_save_dpi: 300
  # Years with fewer patients with an active clinical condition are flagged.
  min_active_patients_per_year: 500
  # The active-patients figure starts this many years before trajectories.start_year, to
  # show where Synthea's export history begins.
  active_patients_history_years: 10
  # Patients drawn at random (with the global seed) for the trajectory examples.
  example_patients: 3
  top_n_transitions: 10
  # reports/features_summary.md: the top comorbidity pairs by lift. All pairs: active
  # together in at least comorbidity_min_count patient-windows. Chronic pairs: each code
  # chronic in at least chronic_min_patients patients and the pair active together in at
  # least chronic_pair_min_patients patients.
  comorbidity_top_pairs: 25
  comorbidity_min_count: 30
  chronic_min_patients: 50
  chronic_pair_min_patients: 30
  # Chronic lift heatmap over the most common chronic codes (each with at least
  # chronic_min_patients); colour clipped to lift 2^-limit .. 2^limit.
  heatmap_codes: 30
  heatmap_log2_lift_limit: 3.0

# Phase 10 report figures (scripts/10_final_figures.py): copied in this order to
# paths.final_figures_dir as <number>_<name>.png, with captions.md. source names a figure
# path of the paths section; each must have been saved at summary.figure_save_dpi.
final_figures:
  figures:
    - source: top_conditions_fig
      name: data_top_conditions
      caption: >-
        The 20 most common condition codes in the raw Synthea export (3,000 patients), by
        number of patients. Social, administrative and situation codes (medication review,
        employment, stress, social isolation) are among the most common, which is why a
        clinical code filter (data.code_filter) keeps only disorders and a reviewed whitelist.
    - source: events_per_patient_fig
      name: data_events_per_patient
      caption: >-
        Condition events per patient in the raw export, every code, before the clinical
        filter (median 29, long right tail).
    - source: active_patients_fig
      name: active_patients_per_year
      caption: >-
        Top: patients alive and patients with an active clinical condition (active from onset
        to STOP or death) per year. Bottom: clinical events dated in each year. Events dated
        rise from about 400 a year to about 2,500 a year from 2017 (apart from a spike in
        2014): Synthea exports a full record only for the 10 years before its run date, so
        earlier years hold mostly conditions that were still open. The windows therefore
        start in 2017. Shaded: feature windows 2017-2022 and label windows 2023-2025.
    - source: comorbidity_heatmap_fig
      name: comorbidity_lift_heatmap
      caption: >-
        Comorbidity lift (observed over expected number of patients with both conditions
        active in the same window, log scale clipped to 1/8-8) between the 30 most common
        chronic conditions, 2017-2022. Rows and columns are ordered by average-linkage
        clustering of the lift profiles. Blocks: diabetic kidney disease (CKD stages 1-2,
        microalbuminuria, proteinuria), cardio-metabolic disease (metabolic syndrome, type 2
        diabetes, hypertriglyceridaemia, ischaemic heart disease, bypass grafting), and
        chronic pain with migraine and drug abuse.
    - source: eigenvalues_fig
      name: laplacian_eigenvalues
      caption: >-
        The 20 smallest eigenvalues of the normalized Laplacian L = I - A_hat of the 2022
        k-NN patient-similarity graph (k = 10, 2,581 patients). The largest gap (k >= 2)
        follows the 7th eigenvalue, so the spectral clustering uses 7 phenotypes. The smooth
        rise (0.028 at i = 2 to 0.126 at i = 20) means the phenotypes partition a continuum
        rather than separate communities.
    - source: graph_drift_fig
      name: graph_drift
      caption: >-
        Neighbourhood overlap (Jaccard of the k-NN neighbour sets) between consecutive yearly
        graphs: mean over patients and interquartile range. The mean rises from 0.405
        (2017 to 2018) to 0.604 (2021 to 2022), with no jump: neighbourhoods stabilise as
        histories accumulate.
    - source: ae_umap_phenotype_fig
      name: graphae_umap_phenotypes
      caption: >-
        UMAP of the self-supervised TemporalGraphAE trajectory embeddings (final GRU state,
        32 dimensions), one panel per Phase 4 spectral phenotype (blue; grey: every other
        patient). Phenotypes 1, 2, 4 and 5 occupy distinct regions; 3 spreads across the
        middle and 7 (47 patients) is scattered. Silhouette against the phenotypes -0.012
        (shuffled labels -0.181): better than chance, but the clusters touch.
    - source: ae_trajectory_fig
      name: graphae_trajectories
      caption: >-
        The TemporalGraphAE state after each year 2017-2022 for 5 patients, on one UMAP of
        every non-empty patient-window; orange marks a year with a new chronic condition.
        The mean yearly step in the 32-dimensional space shrinks from 1.382 (2017 to 2018) to
        0.267 (2021 to 2022): the long first steps are mostly the GRU state settling, and
        later moves coincide with new chronic onsets.
    - source: cv_auroc_fig
      name: cv_auroc
      caption: >-
        Left: pooled out-of-fold AUROC of any_onset (a new chronic onset in 2023-2025) for
        the 8 models of the 5-fold cross-validation (2,221 patients, 414 positives), with
        95% percentile bootstrap intervals. Right: the paired difference from the full
        TemporalGCN. All models lie between 0.553 and 0.585, and no difference is shown.
    - source: next_year_auroc_fig
      name: next_year_auroc
      caption: >-
        New conditions in 2022 predicted from each 2021 embedding (one logistic regression
        per code, test patients). Left: micro AUROC over every patient-code pair; the dashed
        line is the codes' base rates alone (0.760). Right: macro AUROC, the mean over codes.
        The base rates explain the pooled AUROC; within a code the embeddings rank patients
        at 0.503-0.624.
    - source: test_reliability_fig
      name: reliability_test
      caption: >-
        Reliability of the final TemporalGCN's any_onset probabilities on the held-out test
        set (330 patients, 61 positives, 10 equal-count bins), before and after Platt scaling
        fitted on the validation split (a = 0.796, b = -1.272). Test AUROC 0.559
        (0.483-0.632); Brier 0.155 against 0.151 for always predicting the base rate.
