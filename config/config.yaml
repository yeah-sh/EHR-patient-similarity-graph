# Central configuration for the EHR comorbidity-trajectory project.
# Every tunable parameter lives here; code must not hard-code values.
# Relative paths are resolved against the project root, not the working directory.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: artifacts
  reports_dir: reports
  figures_dir: reports/figures
  patients_csv: data/raw/patients.csv
  conditions_csv: data/raw/conditions.csv
  encounters_csv: data/raw/encounters.csv
  events_parquet: data/processed/events.parquet
  events_clinical_parquet: data/processed/events_clinical.parquet
  code_dictionary_csv: data/processed/code_dictionary.csv
  data_summary_md: reports/data_summary.md
  clinical_summary_md: reports/clinical_summary.md
  events_per_patient_fig: reports/figures/events_per_patient_hist.png
  top_conditions_fig: reports/figures/top_conditions_bar.png
  # Phase 2 outputs (trajectories.save_trajectories).
  trajectories_parquet: data/processed/trajectories.parquet
  patient_index_json: data/processed/patient_index.json
  code_vocabulary_json: data/processed/code_vocabulary.json
  windows_npz: data/processed/windows.npz
  windows_json: data/processed/windows.json
  transitions_npz: data/processed/transitions.npz
  trajectories_summary_md: reports/trajectories_summary.md

# Global random seed used by random, numpy and torch.
seed: 42

data:
  min_conditions_per_patient: 2
  # Codes that record one concept under two codes (data.merge_codes), as
  # {old_code: canonical_code}. Applied before code_filter, so a merged code is
  # judged on the descriptions of both. Canonical codes must not be merged again.
  code_merge:
    # Prediabetes (older Synthea) -> Prediabetes (finding). The current single-version
    # data has no 15777000; merge_codes only warns, so the rule is kept for older exports.
    "15777000": "714628002"
  # Which condition codes are clinical (data.filter_clinical_events). A code is kept
  # if ANY of its descriptions ends with a keep_suffix or equals a keep_description,
  # both compared case-insensitively; every other code (social, administrative,
  # symptoms, most history-of, ...) is dropped. Any wording counts because Synthea
  # versions differ: "Stroke" and "Cerebrovascular accident (disorder)" share a code.
  code_filter:
    keep_suffixes: ["(disorder)"]
    keep_descriptions:
      # Metabolic findings
      - Prediabetes (finding)
      - Body mass index 30+ - obesity (finding)
      - Body mass index 40+ - severely obese (finding)
      # Chronic pain and mental health
      - Chronic pain (finding)
      - Chronic low back pain (finding)
      - Chronic neck pain (finding)
      - Severe anxiety (panic) (finding)
      # Injuries tagged other than "(disorder)"
      - Sprain (morphologic abnormality)
      - Burn injury (morphologic abnormality)
      # Disorders this Synthea version records without the "(disorder)" tag
      - Gout
      - Nonproliferative diabetic retinopathy due to type II diabetes mellitus  # 1551000119108
      - Proliferative diabetic retinopathy due to type II diabetes mellitus  # 1501000119109
      # Substance use. Alcoholism and Dependent drug abuse are already kept by
      # "(disorder)"; Opioid abuse (5602001) is untagged in this data, so it is listed.
      - Smokes tobacco daily (finding)
      - Unhealthy alcohol drinking behavior (finding)
      - Misuses drugs (finding)
      - Opioid abuse
      # History of major cardiac events (no cerebrovascular history codes in the data)
      - History of myocardial infarction (situation)
      - History of coronary artery bypass grafting (situation)
      - History of aortic valve replacement (situation)
      # Removed (15): wordings from older Synthea versions that match no code in this
      # export, so they kept nothing: Prediabetes, Hypertension, Hyperlipidemia,
      # Bacteremia (finding), Coronary Heart Disease, Cardiac Arrest, Drug overdose,
      # Escherichia coli urinary tract infection, Cystitis, Brain damage - traumatic,
      # Chronic paralysis due to lesion of spinal cord, Cystic Fibrosis, Infection
      # caused by Pseudomonas aeruginosa, Male Infertility, History of cardiac arrest
      # (situation). Re-add them for an older export; without "Prediabetes", merged
      # 15777000 events are kept only if 714628002 also has its "(finding)" wording.

trajectories:
  window: yearly
  # The data has a complete record only from late 2016, consistent with Synthea's
  # default 10-year export history before the run date (2026-10-30). Before that,
  # mostly conditions still open at the horizon survive: encounters jump from
  # ~2,000/year (2008-2013) to ~11,000/year from 2017, and 71% of clinical events
  # dated before 2016-10-30 have no STOP against 14% after. Earlier windows would
  # miss most acute conditions, so the series starts at the first full year, 2017.
  # Conditions that began earlier and are still active are carried into 2017 by
  # their active span, and the event-level trajectories and transitions keep every
  # event. Events run to 2026-10-30, so 2025 is the last full window.
  start_year: 2017
  end_year: 2025

features:
  tfidf_ngram_range: [1, 2]
  # Exponential time decay exp(-lambda * age_in_years) applied to older events.
  time_decay_lambda: 0.1

graph:
  k: 10
  metric: cosine

labels:
  # Prediction cutoff: features use only events strictly before this date.
  # Trajectories may run past it; only windows that close on or before the cutoff
  # are used as features, and later windows are used for labels only.
  # 2023-01-01 gives feature windows 2017-2022 and label windows 2023-2025.
  cutoff_date: 2023-01-01
  # A patient is positive if a target condition first appears within this many
  # years after the cutoff.
  horizon_years: 3
  # SNOMED-CT codes defining the outcome; to be chosen when labels.py is built.
  target_codes: []

model:
  hidden_dim: 64
  embed_dim: 32
  dropout: 0.5
  lr: 0.01
  # Written as 5.0e-4 (not 5e-4): PyYAML reads 5e-4 as a string.
  weight_decay: 5.0e-4
  epochs: 200

split:
  train: 0.7
  val: 0.15
  test: 0.15

# reports/data_summary.md, reports/clinical_summary.md, reports/trajectories_summary.md
# and their figures.
summary:
  top_n_conditions: 20
  # Age-group edges in completed years, left-closed; .inf leaves the last group open.
  age_bins: [0, 18, 30, 45, 65, 80, .inf]
  events_hist_bins: 40
  figure_dpi: 150
  # Years with fewer patients with an active clinical condition are flagged.
  min_active_patients_per_year: 500
  # Patients drawn at random (with the global seed) for the trajectory examples.
  example_patients: 3
  top_n_transitions: 10
